# configs/kd_config.yml
# Knowledge Distillation training config for student model.
#
# Supports 4 ablation modes by toggling kd_mode and use_imagenet_pretrain:
#   1. baseline:       kd_mode=false, use_imagenet_pretrain=false
#   2. KD only:        kd_mode=true,  use_imagenet_pretrain=false
#   3. pretrain only:  kd_mode=false, use_imagenet_pretrain=true
#   4. KD + pretrain:  kd_mode=true,  use_imagenet_pretrain=true  <-- this file

teacher_conf:
  pretrained_name: "MIT/ast-finetuned-audioset-10-10-0.4593"

train_conf:
  use_gpu: True
  batch_size: 64            # larger batch for stable gradients
  num_workers: 4
  max_epoch: 50
  learning_rate: 5.0e-5     # fine-tuning LR (warm-start from existing student)
  weight_decay: 1.0e-4
  seed: 42
  save_model_dir: 'saved_models/kd_warmstart/'
  patience: 15
  monitor_metric: 'f1'
  use_sampler: false
  use_class_weights: false
  save_every_n_epochs: 5

  # --- Knowledge Distillation ---
  kd_mode: true
  kd_teacher_checkpoint: 'saved_models/teacher_ast/best_model_epoch_18.pth'  # adjust to actual best
  kd_alpha: 0.5         # weight for soft loss (1-alpha = weight for hard loss)
  kd_temperature: 4.0   # softmax temperature
  kd_feature_distill: false  # set true to enable intermediate feature distillation
  kd_feature_beta: 1.0      # weight for feature distillation loss

  # --- Loss ---
  loss_conf:
    loss_type: 'ce'
    gamma: 0.0
    label_smoothing: 0.1
    apply_logit_adj_in_train: true
    apply_logit_adj_in_eval: false
    logit_adj_tau: 1.0
    pair_penalty:
      use_penalty: false

data_conf:
  train_list: 'data/train_list_5s_new.txt'
  val_list: 'data/val_list_5s.txt'
  test_list: 'data/test_list_5s.txt'

model_conf:
  num_classes: 3
  in_channels: 3
  width_mult: 1.0
  # Warm-start from existing best student (already trained on ship acoustics)
  # This is preferred over ImageNet pretrain for domain-specific fine-tuning
  pretrain_student_checkpoint: 'saved_models/M5_Plus_LogitAdj/best_model.pth'
  use_imagenet_pretrain: false   # disabled — using domain-specific warm-start instead
  pretrain_mode: 'backbone_only'
  model_config:
    - [1, 16, 1, 1, 0]
    - [6, 24, 2, 2, 2]   # Pre-DW CBAM
    - [6, 32, 3, 1, 0]
    - [6, 64, 4, 2, 2]   # Pre-DW CBAM
    - [6, 96, 3, 1, 0]
    - [6, 160, 3, 1, 0]
    - [6, 320, 1, 1, 0]
  asymmetric: true
  multiscale: true
