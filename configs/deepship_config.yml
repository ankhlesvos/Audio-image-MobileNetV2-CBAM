data_conf:
  train_list: 'data/train_list.txt'
  test_list: 'data/test_list.txt'

train_conf:
  batch_size: 32  # Reduced from default if needed, adjust based on VRAM
  learning_rate: 0.001
  max_epoch: 50
  use_gpu: True
  num_workers: 4
  save_model_dir: 'saved_models/deepship/'
  weight_decay: 1.0e-4
  loss_conf:
    gamma: 3.0    # 增加 gamma 可以让模型更加关注困难样本 (Cargo/Tug)
    label_smoothing: 0.1
    pair_penalty:
      use_penalty: True
      targets: [[0, 3], [3, 0]] # [True Label, Predicted Label to Penalize]
      weight: 2.0 # 把 Cargo 认成 Tug 或 Tug 认成 Cargo 扣 5 分

model_conf:
  num_classes: 4
  width_mult: 1.0
  in_channels: 3
  # model_config can be added if specific MobileNetV2 structure is needed, 
  # otherwise uses default in model.py
