data_conf:
  train_list: 'data/train_list.txt'
  test_list: 'data/test_list.txt'

train_conf:
  batch_size: 32  # Reduced from default if needed, adjust based on VRAM
  learning_rate: 0.001
  max_epoch: 50
  use_gpu: True
  num_workers: 4
  save_model_dir: 'saved_models/deepship/'
  weight_decay: 1.0e-4

model_conf:
  num_classes: 4
  width_mult: 1.0
  in_channels: 1
  # model_config can be added if specific MobileNetV2 structure is needed, 
  # otherwise uses default in model.py
