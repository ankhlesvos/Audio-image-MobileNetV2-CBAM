data_conf:
  test_list: data/test_list_5s.txt
  train_list: data/train_list_5s_new.txt
  val_list: data/val_list_5s.txt
model_conf:
  asymmetric: true
  audio_mode: false
  force_no_residual: false
  in_channels: 3
  model_config:
  - - 1
    - 16
    - 1
    - 1
    - 0
  - - 6
    - 24
    - 2
    - 2
    - 2
  - - 6
    - 32
    - 3
    - 1
    - 0
  - - 6
    - 64
    - 4
    - 2
    - 2
  - - 6
    - 96
    - 3
    - 1
    - 0
  - - 6
    - 160
    - 3
    - 1
    - 0
  - - 6
    - 320
    - 1
    - 1
    - 0
  multiscale: true
  num_classes: 3
  width_mult: 0.75
train_conf:
  batch_size: 16
  freeze_backbone: false
  learning_rate: 0.001
  loss_conf:
    apply_logit_adj_in_eval: false
    apply_logit_adj_in_train: true
    gamma: 0.0
    label_smoothing: 0.1
    logit_adj_tau: 1.0
    loss_type: ce
    pair_penalty:
      targets:
      - - 1
        - 2
      - - 2
        - 0
      use_penalty: false
      weight: 2.0
  max_epoch: 50
  min_delta: 0.001
  min_epochs: 15
  monitor_metric: val_loss
  num_workers: 4
  patience: 10
  sampler_alpha: 0.5
  save_model_dir: saved_models/scaling/MyNet-M
  seed: 42
  use_class_weights: true
  use_gpu: true
  use_sampler: false
  weight_decay: 0.0001
